services:
  basilisk:
    build:
      context: .
      dockerfile: Dockerfile
    image: basilisk-space-ros-test
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      DISPLAY: ${DISPLAY}
      XAUTHORITY: ${XAUTHORITY}
      XDG_RUNTIME_DIR: /tmp/runtime-root
      QT_X11_NO_MITSHM: "1"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - ${VIDEO_GID:-44}
      - ${RENDER_GID:-110}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY}:${XAUTHORITY}:ro
    command: ["bash", "-lc", "sleep infinity"]
